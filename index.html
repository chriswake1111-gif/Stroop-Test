<!DOCTYPE html>
<html lang="zh-TW" data-theme="warm-sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D97706">
  <meta name="description" content="斯特魯普效應專注力挑戰 - 鍛鍊專注力與反應切換之 Local-First 護眼練習 PWA">
  <title>斯特魯普專注挑戰 | Stroop Test PWA</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>
<body>
  <div id="app">
    <!-- Header Bar -->
    <header class="top-bar">
      <div class="title-group">
        <span class="brand-icon" aria-hidden="true">
          <svg class="svg-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg>
        </span>
        <h1>斯特魯普專注挑戰</h1>
      </div>
      <div class="header-actions">
        <button id="btn-pwa-install" class="btn btn-primary btn-sm" style="display: none;">
          <svg class="svg-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
          <span>安裝 App</span>
        </button>
        <button id="btn-open-settings" class="icon-btn" title="遊戲偏好與模式設定" aria-label="遊戲偏好與模式設定">
          <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-toggle-theme" class="icon-btn" title="切換護眼/暗黑主題" aria-label="切換護眼或暗黑主題">
          <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="btn-toggle-stats" class="icon-btn" title="查看個人戰績與趨勢圖" aria-label="查看個人戰績與趨勢圖">
          <svg class="svg-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        </button>
      </div>
    </header>

    <!-- Mode Selector -->
    <nav class="mode-selector" aria-label="訓練模式選擇">
      <button class="mode-btn active" data-mode="ink-color">經典 (看顏色)</button>
      <button class="mode-btn" data-mode="text-meaning">反向 (看字義)</button>
      <button class="mode-btn" data-mode="dual-switch">雙重切換</button>
    </nav>

    <!-- Main Game Container -->
    <main class="game-container">
      <div class="game-status-bar">
        <span class="streak-tag">
          <svg class="svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <strong id="streak-count">0</strong> 天打卡
        </span>
        <span id="warmup-badge" class="warmup-tag">暖身 <strong id="warmup-count">0</strong>/3</span>
        <span class="timer-tag" id="timer-tag">
          <svg class="svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M12 2v3"/></svg>
          <span id="timer-display">30</span> 秒
        </span>
        <span class="score-tag">
          <svg class="svg-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span id="score-display">0</span> 題
        </span>
      </div>

      <!-- Instruction Prompt -->
      <div id="instruction-banner" class="instruction-banner" aria-live="polite">
        請點擊【文字的顏色】！
      </div>

      <!-- Stroop Word Display Card -->
      <div class="word-display-card" id="word-card">
        <div id="start-overlay" class="start-overlay">
          <h2 class="start-title">準備好開始專注練習了嗎？</h2>
          <p class="start-subtitle">忽略字義干擾，快速選出正確選項</p>
          <button id="btn-start-game" class="btn btn-primary">開始 30 秒暖身</button>
        </div>

        <div id="countdown-overlay" class="countdown-overlay" style="display: none;" aria-live="assertive">
          <span id="countdown-text" class="countdown-num">3</span>
        </div>

        <div id="stroop-word" class="stroop-word" style="display: none;">
          <!-- 動態渲染題目字與顏色 -->
        </div>
      </div>

      <!-- Color Choice Buttons Grid -->
      <div id="answers-grid" class="answers-grid">
        <!-- 動態渲染顏色按鈕 -->
      </div>
    </main>

    <!-- History & Canvas Stats Section (Modal) -->
    <div id="stats-drawer" class="modal-overlay" style="display: none;">
      <div class="modal-card animate-pop">
        <div class="modal-header">
          <span class="badge-icon">
            <svg class="svg-icon" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
          </span>
          <h2>專注力歷史趨勢</h2>
          <p class="badge-title" id="stats-pb-display">個人最佳: -- 題 | 最快 RT: -- ms</p>
        </div>

        <div class="modal-body">
          <canvas id="trend-canvas" style="width: 100%; height: 180px; border-radius: 8px; background: var(--bg-color);"></canvas>
          
          <div class="stats-caption">
            近 10 次練習之平均反應時間 (藍) 與干擾差值 (紫)
          </div>
        </div>

        <div class="modal-footer">
          <button id="btn-close-stats" class="btn btn-primary btn-block">關閉戰績表</button>
        </div>
      </div>
    </div>

    <!-- Dynamic Modal Container -->
    <div id="modal-container"></div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
