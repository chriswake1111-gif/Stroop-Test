<!DOCTYPE html>
<html lang="zh-TW" data-theme="warm-sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#D97706">
  <meta name="description" content="斯特魯普效應專注力挑戰 - 鍛鍊大腦前額葉抑制控制與認知切換能力之 PWA 應用">
  <title>斯特魯普專注挑戰 | Stroop Test PWA</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">
</head>
<body>
  <div id="app">
    <!-- Header Bar -->
    <header class="top-bar">
      <div class="title-group">
        <span style="font-size: 1.4rem;">🧠</span>
        <h1>斯特魯普專注挑戰</h1>
      </div>
      <div>
        <button id="btn-pwa-install" class="btn btn-primary" style="display: none; padding: 6px 12px; font-size: 0.85rem; margin-right: 6px;">📲 安裝 App</button>
        <button id="btn-open-settings" class="icon-btn" title="遊戲偏好與模式設定">⚙️</button>
        <button id="btn-toggle-theme" class="icon-btn" title="切換護眼/暗黑主題">👁️</button>
        <button id="btn-toggle-stats" class="icon-btn" title="查看個人戰績與趨勢圖">📊</button>
      </div>
    </header>

    <!-- Mode Selector -->
    <nav class="mode-selector">
      <button class="mode-btn active" data-mode="ink-color">經典 (看顏色)</button>
      <button class="mode-btn" data-mode="text-meaning">反向 (看字義)</button>
      <button class="mode-btn" data-mode="dual-switch">⚡ 雙重切換</button>
    </nav>

    <!-- Main Game Container -->
    <main class="game-container">
      <div class="game-status-bar">
        <span class="streak-tag">🔥 <strong id="streak-count">0</strong> 天打卡</span>
        <span id="warmup-badge">暖身: <strong id="warmup-count">0</strong>/3</span>
        <span class="timer-tag" id="timer-tag">⏱️ <span id="timer-display">30</span> 秒</span>
        <span class="score-tag">🎯 <span id="score-display">0</span> 題</span>
      </div>

      <!-- Instruction Prompt -->
      <div id="instruction-banner" class="instruction-banner">
        請點擊【文字的顏色】！
      </div>

      <!-- Stroop Word Display Card -->
      <div class="word-display-card" id="word-card">
        <div id="start-overlay" class="start-overlay">
          <h2 style="font-size: 1.3rem;">準備好挑戰大腦了嗎？</h2>
          <p style="font-size: 0.9rem; color: var(--text-muted);">忽視字義干擾，快速點擊正確色彩！</p>
          <button id="btn-start-game" class="btn btn-primary">開始 30 秒暖身 🚀</button>
        </div>

        <div id="countdown-overlay" class="countdown-overlay" style="display: none;">
          <span id="countdown-text" class="countdown-num">3</span>
        </div>

        <div id="stroop-word" class="stroop-word" style="display: none;">
          <!-- 動態渲染題目字與顏色 -->
        </div>
      </div>

      <!-- Color Choice Buttons Grid -->
      <div id="answers-grid" class="answers-grid">
        <!-- 動態渲染顏色按鈕 -->
      </div>
    </main>

    <!-- History & Canvas Stats Section (Modal or Bottom Drawer) -->
    <div id="stats-drawer" class="modal-overlay" style="display: none;">
      <div class="modal-card animate-pop">
        <div class="modal-header">
          <span class="badge-icon">📊</span>
          <h2>專注力歷史趨勢</h2>
          <p class="badge-title" id="stats-pb-display">個人最佳: -- 題 | 最快 RT: -- ms</p>
        </div>

        <div class="modal-body">
          <canvas id="trend-canvas" style="width: 100%; height: 180px; border-radius: 8px; background: var(--bg-color);"></canvas>
          
          <div style="margin-top: 12px; font-size: 0.85rem; color: var(--text-muted); text-align: center;">
            💡 近 10 次測試之平均反應時間 (藍) 與 Stroop 干擾值 (紫)
          </div>
        </div>

        <div class="modal-footer">
          <button id="btn-close-stats" class="btn btn-primary btn-block">關閉戰績表</button>
        </div>
      </div>
    </div>

    <!-- Dynamic Modal Container -->
    <div id="modal-container"></div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
